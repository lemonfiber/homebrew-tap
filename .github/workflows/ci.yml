name: ci
on: [pull_request]
jobs:
  spec-check:
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@main
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@main
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@main
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@main
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@main
