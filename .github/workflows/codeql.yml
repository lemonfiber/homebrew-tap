# CodeQL static analysis. Three languages have source here: the Ruby formula
# `brew` loads and runs on a user's machine, the Python the formula gate runs in
# CI, and the workflows themselves. Q-R53.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 2"
permissions:
  contents: read
# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  # Whether this change reaches anything an analysis reads, for the analysis
  # below. The paths listed are the readme, the agent guides and the licence: no
  # analysis reads them, and neither does `formula.yml`. Anything else runs
  # every analysis, and so does a file deleted or renamed, or a change with no
  # base to compare against.
  scope:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, so the base is here to compare against, and no file
          # contents but the checkout's: the comparison reads trees.
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          # A pull request's base, a merge group's, or on a push the commit
          # before it. A schedule has none.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No commit to compare against, so every analysis runs."
            exit 0
          fi
          changed="$(git diff --no-renames --name-status "${BASE}" HEAD)"
          code=false
          while IFS=$'\t' read -r status path; do
            case "${status}:${path}" in
            : | [AM]:README.md | [AM]:AGENTS.md | [AM]:CLAUDE.md | [AM]:LICENSE) ;;
            *) code=true ;;
            esac
          done <<< "${changed}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" = false ]; then
            echo "Only files no analysis reads changed, so none runs."
          fi

  analyze:
    needs: scope
    # Runs whatever `what changed` said, because a matrix job skipped whole
    # reports with its matrix unexpanded and the required `analyze (actions)`,
    # `analyze (python)` and `analyze (ruby)` would never appear. Where the
    # change reaches nothing an analysis reads its steps skip instead, and each
    # language reports success having analysed nothing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    env:
      CODE: ${{ needs.scope.result != 'success' || needs.scope.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, ruby]
    steps:
      - name: No code changed, so nothing is analysed
        if: env.CODE != 'true'
        env:
          LANGUAGE: ${{ matrix.language }}
        run: echo "::notice::Only files no analysis reads changed, so no ${LANGUAGE} analysis runs."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CODE == 'true'
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3
        if: env.CODE == 'true'
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3
        if: env.CODE == 'true'

  # The analysis finding something is not the same as anything stopping it. The
  # check GitHub raises beside it compares the configurations a pull request
  # produced against every one seen on `main`, and the supply-chain scan uploads
  # three that only ever run on `main` — so it is neutral on every pull request,
  # whatever the analysis found, and gates nothing. This asks the question that
  # was meant: is there an open alert against what this branch proposes.
  #
  # `!cancelled()` rather than `always()`, and rather than `needs:` alone: a
  # `needs:` dependency that fails makes this job vanish, and a skipped required
  # check satisfies branch protection — so the one gate that refuses an alert
  # would be absent in exactly the case where the analysis went wrong. A
  # cancelled run is somebody pressing stop, and finishing the job they stopped
  # serves nobody. The gate refuses a commit it has no analysis of, by language
  # and by name, so running it after a failed analysis says what is missing
  # rather than passing on an empty list.
  alerts:
    needs: [scope, analyze]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      security-events: read
    uses: lemonfiber/spec/.github/workflows/codeql-alerts.yml@999f97e9414290f029391d5d541087b8a6d23bdf # v1.0.29
    with:
      analysis: ${{ needs.analyze.result }}
      # Whether the analysis above ran at all. Where the change reaches nothing
      # an analysis reads it did not, and the gate says so rather than refusing
      # a commit with no analysis; a skipped call would report as `alerts`, not
      # the required `alerts / alerts`.
      code: ${{ needs.scope.result != 'success' || needs.scope.outputs.code == 'true' }}
