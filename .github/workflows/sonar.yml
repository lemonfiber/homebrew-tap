# Gate this repo's PRs on zero new SonarCloud issues.
#
# The scan is SonarCloud Automatic Analysis against `lemonfiber_homebrew-tap`;
# there is no scan job here. This reads the summary that analysis posts and
# enforces the standard the free plan's own quality gate cannot (Q-R64),
# through the shared reusable in spec so every repo gates identically.
name: sonar
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@f83b90592c5a03cf179102f3c08ba20b282a6818 # v1.0.143
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
