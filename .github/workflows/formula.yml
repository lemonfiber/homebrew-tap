# The formula this tap serves, read before it merges.
#
# `ci.yml` runs the shared gates — governance, spelling, links, workflow lint,
# secrets — and not one of them parses Ruby. `Formula/lemonfiber.rb` is what
# `brew install lemonfiber/tap/lemonfiber` executes, and a formula that cannot
# load fails for whoever typed that, not here.
name: formula
on: [pull_request]
permissions:
  contents: read

# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Whether this change reaches anything the formula job reads. The paths
  # listed are the readme, the agent guides and the licence: neither the
  # formula check nor ruff reads them. Anything else runs the job, and so does
  # a file deleted or renamed, or a change with no base to compare against.
  scope:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, so the base is here to compare against, and no file
          # contents but the checkout's: the comparison reads trees.
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No commit to compare against, so the formula is checked."
            exit 0
          fi
          changed="$(git diff --no-renames --name-status "${BASE}" HEAD)"
          code=false
          while IFS=$'\t' read -r status path; do
            case "${status}:${path}" in
            : | [AM]:README.md | [AM]:AGENTS.md | [AM]:CLAUDE.md | [AM]:LICENSE) ;;
            *) code=true ;;
            esac
          done <<< "${changed}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" = false ]; then
            echo "Only files the formula job does not read changed, so it is skipped."
          fi

  formula:
    needs: scope
    # Skipped where the change reaches nothing it reads, which reports the
    # required `formula` as skipped; run wherever `what changed` did not
    # succeed, so an answer that could not be reached checks the formula.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This tap carries Python that decides whether the formula merges, and
      # nothing here read it. `check_shared_files.py` asks a repository's ruff
      # config to match the shared floor and does not ask a repository with no
      # config for one, so the gap was invisible from both ends.
      - name: Lint the scripts
        run: pipx run ruff==0.16.4 check scripts/

      # `brew style` is Homebrew's own RuboCop with the formula cops loaded.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: The formula is one brew can load and run
        run: python3 scripts/check_formula.py

      # A rule nobody has watched fail is a rule nobody knows works.
      - name: Every rule refuses the formula it exists to refuse
        run: python3 scripts/check_formula.py --self-test
